services:
  # Backend API (FastAPI)
  - type: web
    name: navigator-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PORT
        value: 8000
      - key: FRONTEND_ORIGIN
        value: https://navigator-ai-pink.vercel.app
      - key: CORS_ORIGINS
        value: https://navigator-ai-pink.vercel.app,http://localhost:3000
      - key: OLLAMA_MODEL
        value: deepseek-r1:8b

  # Frontend Web App (Next.js)
  - type: web
    name: navigator-ai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
